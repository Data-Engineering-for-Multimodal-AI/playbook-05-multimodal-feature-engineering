[project]
name = "playbook-05-multimodal-feature-engineering"
version = "2026.10"
description = "Multimodal feature engineering on Waymo Open Motion + WOMD-Reasoning (Data Engineering for Multimodal AI, Chapter 5)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "seaborn>=0.13",               # multimodal_feature_pipeline.py
    "sentence-transformers>=3.0",
    "tensorflow>=2.20",            # reads the WOMD tf.Example TFRecords; 2.20+ supports Python 3.13
    "tqdm>=4.66",
    "umap-learn>=0.5.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
