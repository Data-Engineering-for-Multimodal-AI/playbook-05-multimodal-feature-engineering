name: smoke

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # weekly, Monday 06:00 UTC, so breakage in upstream packages shows up

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Cache Sentence-BERT models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-models-all-mpnet-base-v2-paraphrase-MiniLM-L6-v2
      - name: Smoke test (synthetic data in the Waymo formats)
        run: make smoke
      # README "Run it", steps 2 and 4 on synthetic data (CI has no Waymo data)
      - name: Run it, steps 2 and 4
        run: |
          make run | tee /tmp/run.txt
          grep -q "Processed 10 scenarios, 10 successful." /tmp/run.txt
          grep -q "NOTE: the output above is from SYNTHETIC data" /tmp/run.txt
          make show | tee /tmp/show.txt
          grep -q "is_yielding            True" /tmp/show.txt
      - name: Use your own data (file checks)
        run: |
          uv run --frozen pytest -q tests/test_own_data.py
          make check-data DIR=synthetic/data | tee /tmp/check.txt
          grep -q "All files passed the checks." /tmp/check.txt
      # On synthetic data: checks that they run, not their numbers
      - name: Try this 1, 2 and 3
        run: |
          make try-leakage | tee /tmp/t1.txt
          grep -q "Data: SYNTHETIC data" /tmp/t1.txt
          make try-split
          make try-text-dims
      - name: Free disk space for the second install
        run: rm -rf .venv && uv cache clean
      - name: Printed install path (pip install -r requirements.txt)
        run: |
          uv venv --seed --python ${{ matrix.python-version }} /tmp/pipenv
          /tmp/pipenv/bin/python -m pip install -q -r requirements.txt
          /tmp/pipenv/bin/python tests/make_fixture.py /tmp/fixture
          WAYMO_DATA_DIR=/tmp/fixture /tmp/pipenv/bin/python validation_data_analysis.py

  devcontainer:
    # Builds .devcontainer/ the way Codespaces does and runs the playbook inside it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the devcontainer and run the playbook
        uses: devcontainers/ci@v0.3
        with:
          push: never
          # make run, timed from a clean devcontainer
          runCmd: start=$(date +%s) && make run && echo "Time to first output in a clean devcontainer was $(( $(date +%s) - start )) s"
